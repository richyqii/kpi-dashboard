name: Sync KPI documents
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-documents.yml'
      - 'scripts/sync-documents.cjs'
permissions:
  contents: write
concurrency:
  group: kpi-document-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download saved files and remove deleted versions
        run: node scripts/sync-documents.cjs
      - name: Save repository changes
        shell: bash
        run: |
          git add -- data/uploads/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync KPI documents from Version History'
          git push origin HEAD:main
